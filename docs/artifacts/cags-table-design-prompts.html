<script type="text/markdown" id="src"># C.A.Gs Homepage Tables — Claude Design Prompt Pack

Four prompts, one per homepage table. Each produces **4 style directions x 3 viewports = 12 artboards**.
Across all four runs: **16 designs, 48 artboards.**

## How to run this

**Run the four prompts separately — one per table (Recommended).**

Each prompt below is complete on its own: brand colours, sizes, rules and the table's exact text are
all inside it. Paste one, get 12 artboards, then start a fresh Claude Design run for the next table.

**Why separate runs rather than one:** 48 artboards in a single run is where canvas builds start
dropping detail and truncating late artboards — the last table would come back worse than the first.
Separate runs also mean that if Table 3 comes back wrong, you re-run Table 3 alone instead of
regenerating all sixteen designs. **The trade-off:** the four runs will not share a house style
unless you pick the same letter across all four tables, so compare the letters before you commit.

The preamble repeats inside every prompt. That is deliberate — it makes each one a single paste.

**Bring back to me for the build:** the canvas link plus your pick per table, written as
`Table 1c, Table 2a, Table 3c, Table 4b`. If you edited an artboard inside Claude Design, say so —
I build from what is on the canvas, not from the original prompt.

## The four style directions

Every table uses the same four, so `a` means the same thing on Table 1 as on Table 4 and you can
compare like with like.

| | Direction | What it is |
|---|---|---|
| **a** | Elevated Cards | Soft-shadowed rounded panels, generous padding, column headers as floating chips. Modern product-pricing feel. |
| **b** | Editorial Rule | Type-led and near-boxless. Large Newsreader display, thin forest hairlines, wide whitespace, small-caps labels. |
| **c** | Dark Panel | The table sits on a deep forest ground with cream text and mint values, one column or row lifted. Premium, high contrast. |
| **d** | Split Feature | Asymmetric. A lead summary panel beside the data; on mobile the summary becomes a strip across the top. |

Produce 48 artboards total across four tables: Table 1a-1d, Table 2a-2d, Table 3a-3d and Table

<script>
(function () {
  var raw = document.getElementById('src').textContent;

  // Split the single markdown source into sections at each "## " heading.
  var parts = raw.split(/\n(?=## )/);
  var intro = parts.shift(); // the "# " title block — not rendered as a section
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');

  function slug(s) {
    return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  }

  var sections = parts.map(function (block) {
    var nl = block.indexOf('\n');
    var title = block.slice(3, nl < 0 ? undefined : nl).trim();
    var body = nl < 0 ? '' : block.slice(nl + 1);
    // A section whose body is a fenced block copies the fence CONTENTS —
    // that is the thing you paste into Claude Design.
    var fence = body.match(/```\n([\s\S]*?)\n```/);
    return {
      title: title,
      id: slug(title),
      body: body,
      copy: fence ? fence[1] : ('## ' + title + '\n' + body).trim(),
      isPrompt: !!fence
    };
  });

  var icon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

  sections.forEach(function (s) {
    var a = document.createElement('a');
    a.href = '#' + s.id;
    a.textContent = s.title;
    nav.appendChild(a);

    var sec = document.createElement('section');
    sec.id = s.id;

    var head = document.createElement('div');
    head.className = 'sec-head';
    var h = document.createElement('h2');
    h.textContent = s.title;
    head.appendChild(h);

    var btn = document.createElement('button');
    btn.className = 'b-copy';
    btn.innerHTML = icon + (s.isPrompt ? ' Copy prompt' : ' Copy section');
    btn.addEventListener('click', function () { copy(s.copy, btn, s.isPrompt); });
    head.appendChild(btn);
    sec.appendChild(head);

    if (s.isPrompt) {
      // Prose above the fence (if any), then the payload sheet.
      var before = s.body.split('```')[0].trim();
      if (before) {
        var p = document.createElement('div');
        p.className = 'prose';
        p.innerHTML = marked.parse(before);
        sec.appendChild(p);
      }
      var sheet = document.createElement('div');
      sheet.className = 'sheet';
      var bar = document.createElement('div');
      bar.className = 'sheet-bar';
      var lbl = document.createElement('span');
      lbl.textContent = 'paste into claude design';
      bar.appendChild(lbl);
      var b2 = document.createElement('button');
      b2.className = 'b-clay';
      b2.innerHTML = icon + ' Copy';
      b2.addEventListener('click', function () { copy(s.copy, b2, true); });
      bar.appendChild(b2);
      sheet.appendChild(bar);
      var pre = document.createElement('pre');
      pre.textContent = s.copy;
      sheet.appendChild(pre);
      sec.appendChild(sheet);

      var after = s.body.split('```').slice(2).join('```').trim();
      if (after) {
        var p2 = document.createElement('div');
        p2.className = 'prose';
        p2.innerHTML = marked.parse(after);
        sec.appendChild(p2);
      }
    } else {
      var d = document.createElement('div');
      d.className = 'prose';
      d.innerHTML = marked.parse(s.body);
      d.querySelectorAll('table').forEach(function (t) {
        var w = document.createElement('div');
        w.className = 'tblwrap';
        t.parentNode.insertBefore(w, t);
        w.appendChild(t);
      });
      sec.appendChild(d);
    }
    main.appendChild(sec);
  });

  var foot = document.createElement('p');
  foot.className = 'foot';
  foot.textContent = 'Every figure in these prompts is transcribed from the live homepage. Prices, bird names and species names are real — if Claude Design changes one, that artboard is wrong.';
  main.appendChild(foot);

  function copy(text, btn, isPrompt) {
    var label = btn.innerHTML;
    navigator.clipboard.writeText(text).then(function () {
      btn.classList.add('done');
      btn.innerHTML = isPrompt ? 'Copied — now paste it' : 'Copied';
      setTimeout(function () { btn.classList.remove('done'); btn.innerHTML = label; }, 1900);
    }).catch(function () {
      btn.innerHTML = 'Press Ctrl/Cmd+C';
      setTimeout(function () { btn.innerHTML = label; }, 1900);
    });
  }

  document.getElementById('copyall').addEventListener('click', function () {
    copy(raw, this, false);
  });

  document.getElementById('dl').addEventListener('click', function () {
    var btn = this, label = btn.innerHTML;
    var d = window.claude && window.claude.downloads;
    if (!d) { btn.innerHTML = 'Use Copy everything'; setTimeout(function(){ btn.innerHTML = label; }, 2200); return; }
    d.save({ filename: 'cags-table-design-prompts.md', data: raw }).then(function () {
      btn.innerHTML = 'Saved'; setTimeout(function () { btn.innerHTML = label; }, 1900);
    }).catch(function (e) {
      btn.innerHTML = (e && e.code === 'declined') ? 'Cancelled' : 'Use Copy everything';
      setTimeout(function () { btn.innerHTML = label; }, 2200);
    });
  });

  // Mark the section currently in view.
  var links = [].slice.call(nav.querySelectorAll('a'));
  var obs = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (l) { l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id); });
    });
  }, { rootMargin: '-10% 0px -75% 0px' });
  document.querySelectorAll('section').forEach(function (s) { obs.observe(s); });
  if (links[0]) links[0].classList.add('on');
})();
</script>
